<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>开心拼图乐园</title>
<style>
  :root{
    --accent:#FF8FAE;
    --bg:#FFF6EC;
    --card-shadow: 0 8px 0 rgba(0,0,0,0.08), 0 10px 24px rgba(0,0,0,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    touch-action: manipulation;
    -webkit-user-select:none; user-select:none;
  }
  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .screen{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:30px;
  }
  .screen.active{ display:flex; }

  /* ---------- 顶部栏 ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 14px 6px 14px;
    flex-shrink:0;
  }
  .round-btn{
    width:46px; height:46px; border-radius:50%;
    background:#fff; border:none; box-shadow:var(--card-shadow);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; cursor:pointer;
    flex-shrink:0;
  }
  .round-btn:active{ transform:scale(0.92); }
  .title-text{
    font-size:20px; font-weight:800; color:#5a4332;
    text-align:center; flex:1; margin:0 8px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .spacer46{ width:46px; flex-shrink:0; }

  /* ---------- 首页 ---------- */
  .home-hero{
    text-align:center; padding:6px 10px 10px;
    flex-shrink:0;
  }
  .home-hero .big-title{
    font-size:30px; font-weight:900; color:#5a4332; margin:4px 0 2px;
    letter-spacing:1px;
  }
  .home-hero .sub-title{
    font-size:15px; color:#9a8572; margin:0;
  }
  .grid-wrap{
    flex:1;
    padding:6px 18px 18px;
    display:flex; flex-direction:column; gap:16px;
    align-items:stretch;
  }
  .theme-card{
    border:none; border-radius:28px;
    display:flex; align-items:center; gap:16px;
    padding:18px 20px;
    box-shadow:var(--card-shadow);
    cursor:pointer;
    font-family:inherit;
    text-align:left;
    transition:transform .08s;
  }
  .theme-card:active{ transform:scale(0.96); }
  .theme-card .emoji-badge{
    width:64px; height:64px; border-radius:50%;
    background:rgba(255,255,255,0.55);
    display:flex; align-items:center; justify-content:center;
    font-size:36px; flex-shrink:0;
  }
  .theme-card .texts{ flex:1; }
  .theme-card .t-name{ font-size:21px; font-weight:800; color:#4a3826; }
  .theme-card .t-desc{ font-size:13px; color:#6b5744; margin-top:2px; }
  .theme-card .arrow{ font-size:24px; color:#4a3826; opacity:.5; }

  /* ---------- 难度选择 ---------- */
  .diff-list{
    flex:1; padding:10px 18px 18px; display:flex; flex-direction:column; gap:16px;
  }
  .diff-card{
    border:none; border-radius:28px; padding:20px;
    display:flex; align-items:center; gap:16px;
    box-shadow:var(--card-shadow); cursor:pointer; font-family:inherit; text-align:left;
    background:#fff;
    border:4px solid transparent;
  }
  .diff-card:active{ transform:scale(0.96); }
  .diff-card .pieces-badge{
    width:60px; height:60px; border-radius:18px;
    display:flex; align-items:center; justify-content:center;
    font-size:24px; font-weight:900; color:#fff; flex-shrink:0;
  }
  .diff-card .texts{ flex:1; }
  .diff-card .d-name{ font-size:19px; font-weight:800; color:#4a3826; }
  .diff-card .d-stars{ font-size:15px; margin-top:4px; letter-spacing:2px; }

  /* ---------- 关卡列表 ---------- */
  .level-grid{
    flex:1; padding:8px 16px 18px;
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
    align-content:start;
  }
  .level-card{
    border:none; border-radius:24px; background:#fff;
    box-shadow:var(--card-shadow); cursor:pointer; padding:12px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    position:relative;
  }
  .level-card:active{ transform:scale(0.95); }
  .level-card img{ width:100%; aspect-ratio:1/1; border-radius:16px; display:block; }
  .level-card .l-name{ font-size:15px; font-weight:700; color:#4a3826; }
  .level-card .done-badge{
    position:absolute; top:6px; right:6px;
    background:#53C97E; color:#fff; width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:14px;
    box-shadow:0 2px 4px rgba(0,0,0,.2);
  }

  /* ---------- 拼图页 ---------- */
  .puzzle-wrap{
    flex:1; display:flex; flex-direction:column; align-items:center;
    padding:6px 16px 10px; gap:10px; min-height:0;
  }
  .ref-box{
    display:flex; align-items:center; gap:10px;
    background:#fff; border-radius:20px; padding:8px 14px;
    box-shadow:var(--card-shadow);
    flex-shrink:0;
  }
  .ref-box img{ width:56px; height:56px; border-radius:12px; }
  .ref-box .ref-label{ font-size:13px; color:#9a8572; }
  .ref-box .ref-label b{ display:block; font-size:16px; color:#4a3826; }

  #board-wrap{
    flex-shrink:0;
    border-radius:28px;
    overflow:hidden;
    box-shadow:var(--card-shadow);
    background:#fff;
    position:relative;
  }
  #board{
    display:grid;
    width:100%; height:100%;
  }
  .slot{
    position:relative;
    border:2px dashed rgba(0,0,0,0.18);
    box-sizing:border-box;
    overflow:hidden;
  }
  .slot .ghost{
    position:absolute; inset:0;
    opacity:0.16;
    pointer-events:none;
  }
  .slot.filled{ border:none; }

  #tray-wrap{
    flex:1; width:100%;
    min-height:0;
    display:flex; flex-direction:column;
    margin-top:4px;
  }
  #tray-label{
    font-size:13px; color:#9a8572; text-align:center; margin-bottom:4px; flex-shrink:0;
  }
  #tray{
    flex:1; overflow-y:auto;
    display:flex; flex-wrap:wrap; justify-content:center; align-content:flex-start;
    gap:14px; padding:6px 4px 10px;
  }
  .piece{
    border-radius:14px;
    box-shadow:0 4px 10px rgba(0,0,0,0.18);
    cursor:grab;
    border:3px solid #fff;
    touch-action:none;
    background-color:#eee;
  }
  .piece.dragging{
    box-shadow:0 10px 24px rgba(0,0,0,0.3);
    z-index:999;
  }

  .bottom-actions{
    display:flex; justify-content:center; gap:14px; padding:8px 0 2px; flex-shrink:0;
  }
  .pill-btn{
    border:none; border-radius:22px; padding:10px 20px;
    font-size:14px; font-weight:700; color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,0.1);
    cursor:pointer;
  }
  .pill-btn:active{ transform:scale(0.95); }
  .pill-btn.secondary{ background:#B9ADA0; }
  .pill-btn.primary{ background:var(--accent); }

  /* ---------- 完成弹窗 ---------- */
  #win-modal{
    position:fixed; inset:0; display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,0.45);
    z-index:2000;
  }
  #win-modal.show{ display:flex; }
  .win-card{
    background:#fff; border-radius:30px; padding:30px 26px;
    text-align:center; width:min(84vw, 320px);
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    animation:popIn .35s ease;
  }
  @keyframes popIn{
    0%{ transform:scale(0.6); opacity:0; }
    70%{ transform:scale(1.05); opacity:1; }
    100%{ transform:scale(1); }
  }
  .win-card .win-emoji{ font-size:56px; }
  .win-card .win-title{ font-size:22px; font-weight:900; color:#4a3826; margin:6px 0 4px; }
  .win-card .win-sub{ font-size:14px; color:#9a8572; margin-bottom:16px; }
  .win-card .win-actions{ display:flex; flex-direction:column; gap:10px; }

  /* 五彩纸屑 */
  .confetti{
    position:fixed; top:-30px; font-size:24px; pointer-events:none; z-index:2500;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(360deg); opacity:0.2; }
  }

  /* 手机横屏/宽屏自适配：拼图区左右布局 */
  @media (min-width:640px){
    .puzzle-wrap{ flex-direction:row; align-items:flex-start; flex-wrap:wrap; justify-content:center; }
    .ref-box{ flex-direction:column; order:0; }
    #board-wrap{ order:1; }
    #tray-wrap{ order:2; width:260px; flex:0 0 260px; max-height:100%; }
  }
</style>
</head>
<body>
<div id="app" data-qw-id="e1">

  <!-- 首页：选主题 -->

<script>
(function(){
"use strict";

/* ======================================================
   1. 卡通图案数据（纯 SVG 绘制，无需网络、无版权问题）

function bgRect(color){
  return '<rect x="0" y="0" width="300" height="300" rx="30" fill="'+color+'"/>';
}
function wrapSvg(inner){
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">'+inner+'</svg>';
}
function svgToUrl(svgStr){
  return "data:image/svg+xml;utf8," + encodeURIComponent(svgStr);
}

/* ======================================================
   3. 声音（WebAudio，无需外部文件）
   ====================================================== */
let audioCtx = null;
let muted = (localStorage.getItem('puzzleMuted') === '1');

function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
}
function tone(freq, start, dur, type, vol){
  if(muted || !audioCtx) return;
  const t0 = audioCtx.currentTime + start;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol||0.2, t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sndPlace(){ tone(720,0,0.12,'triangle',0.22); }
function sndWrong(){ tone(260,0,0.16,'sine',0.14); }
function sndWin(){
  tone(523,0,0.18,'triangle',0.22);
  tone(659,0.15,0.18,'triangle',0.22);
  tone(784,0.3,0.26,'triangle',0.24);
  tone(988,0.5,0.3,'triangle',0.22);
}

/* ======================================================
   6. 拼图核心逻辑
   ====================================================== */
let puzzleCtx = null; // 当前拼图运行状态

function startPuzzle(){
  const theme = getTheme(state.themeId);
  const diff = getDifficulty(state.diffId);
  const item = theme.items[state.levelIndex];

  document.getElementById('puzzle-title').textContent = item.name;
  document.getElementById('ref-name').textContent = item.name;
  const svgStr = item.draw();
  const url = svgToUrl(svgStr);
  document.getElementById('ref-img').src = url;

  buildBoard(diff, url, theme.id, diff.id, item.id);
  showScreen('puzzle');
}

function computeBoardSize(){
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const maxByWidth = vw * 0.8;
  const maxByHeight = vh * 0.42;
  return Math.max(180, Math.min(340, maxByWidth, maxByHeight));
}

function buildBoard(diff, imgUrl, themeId, diffId, itemId){
  const boardWrap = document.getElementById('board-wrap');
  const board = document.getElementById('board');
  const tray = document.getElementById('tray');
  board.innerHTML = '';
  tray.innerHTML = '';

  const size = computeBoardSize();
  boardWrap.style.width = size+'px';
  boardWrap.style.height = size+'px';
  board.style.gridTemplateColumns = `repeat(${diff.cols}, 1fr)`;
  board.style.gridTemplateRows = `repeat(${diff.rows}, 1fr)`;

  const pieceW = size / diff.cols;
  const pieceH = size / diff.rows;
  const total = diff.cols * diff.rows;

  const slots = [];
  for(let r=0; r<diff.rows; r++){
    for(let c=0; c<diff.cols; c++){
      const index = r*diff.cols + c;
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.index = index;
      const ghost = document.createElement('div');
      ghost.className = 'ghost';
      ghost.style.backgroundImage = `url("${imgUrl}")`;
      ghost.style.backgroundSize = size+'px '+size+'px';
      ghost.style.backgroundPosition = (-c*pieceW)+'px '+(-r*pieceH)+'px';
      slot.appendChild(ghost);
      board.appendChild(slot);
      slots.push(slot);
    }
  }

  const order = [];
  for(let i=0;i<total;i++) order.push(i);
  shuffle(order);

  const pieceSize = Math.min(pieceW, pieceH) * 0.94;
  const pieces = [];
  order.forEach(index=>{
    const r = Math.floor(index / diff.cols);
    const c = index % diff.cols;
    const piece = document.createElement('div');
    piece.className = 'piece';
    piece.dataset.correctIndex = index;
    piece.style.width = pieceW+'px';
    piece.style.height = pieceH+'px';
    piece.style.backgroundImage = `url("${imgUrl}")`;
    piece.style.backgroundSize = size+'px '+size+'px';
    piece.style.backgroundPosition = (-c*pieceW)+'px '+(-r*pieceH)+'px';
    tray.appendChild(piece);
    pieces.push(piece);
    attachDrag(piece);
  });

  puzzleCtx = {
    themeId, diffId, itemId,
    size, cols:diff.cols, rows:diff.rows, pieceW, pieceH,
    total, filled:0, slots, tray
  };
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  }
  // 避免洗牌后刚好和原顺序一致（可选，简单兜底）
  return arr;
}

/* ---- 拖拽实现（Pointer Events，支持鼠标+触屏） ---- */
function attachDrag(piece){
  let startX=0, startY=0, origParent=null, origNext=null;
  let curLeft=0, curTop=0;

  function onDown(e){
    if(piece.dataset.locked === '1') return;
    ensureAudio();
    const rect = piece.getBoundingClientRect();
    origParent = piece.parentNode;
    origNext = piece.nextSibling;

    piece.setPointerCapture && piece.setPointerCapture(e.pointerId);

    document.body.appendChild(piece);
    piece.style.position = 'fixed';
    piece.style.left = rect.left+'px';
    piece.style.top = rect.top+'px';
    piece.style.width = rect.width+'px';
    piece.style.height = rect.height+'px';
    piece.style.margin = '0';
    piece.classList.add('dragging');

    curLeft = rect.left; curTop = rect.top;
    startX = e.clientX; startY = e.clientY;

    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }

  function onMove(e){
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    piece.style.left = (curLeft+dx)+'px';
    piece.style.top = (curTop+dy)+'px';
  }

  function onUp(e){
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    piece.classList.remove('dragging');

    const rect = piece.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;

    let bestSlot = null, bestDist = Infinity;
    puzzleCtx.slots.forEach(slot=>{
      if(slot.classList.contains('filled')) return;
      const sr = slot.getBoundingClientRect();
      const scx = sr.left + sr.width/2;
      const scy = sr.top + sr.height/2;
      const dist = Math.hypot(cx-scx, cy-scy);
      if(dist < bestDist){ bestDist = dist; bestSlot = slot; }
    });

    const threshold = Math.max(puzzleCtx.pieceW, puzzleCtx.pieceH) * 0.65;

    if(bestSlot && bestDist < threshold){
      const slotIndex = parseInt(bestSlot.dataset.index,10);
      const correctIndex = parseInt(piece.dataset.correctIndex,10);
      if(slotIndex === correctIndex){
        lockPieceIntoSlot(piece, bestSlot);
        return;
      } else {
        sndWrong();
        wiggle(piece);
      }
    }
    returnToTray(piece, origParent, origNext);
  }

  piece.addEventListener('pointerdown', onDown);
}

function wiggle(el){
  el.style.transition = 'transform .08s';
  let n = 0;
  const seq = [-8,8,-6,6,0];
  function step(){
    if(n >= seq.length){ el.style.transition=''; return; }
    el.style.transform = `translateX(${seq[n]}px)`;
    n++;
    setTimeout(step, 70);
  }
  step();
}

function returnToTray(piece, origParent, origNext){
  piece.style.position = '';
  piece.style.left = '';
  piece.style.top = '';
  piece.style.width = puzzleCtx.pieceW+'px';
  piece.style.height = puzzleCtx.pieceH+'px';
  piece.style.margin = '';
  if(origNext && origNext.parentNode === origParent){
    origParent.insertBefore(piece, origNext);
  } else {
    origParent.appendChild(piece);
  }
}

function lockPieceIntoSlot(piece, slot){
  piece.dataset.locked = '1';
  piece.style.position = 'absolute';
  piece.style.left = '0';
  piece.style.top = '0';
  piece.style.width = '100%';
  piece.style.height = '100%';
  piece.style.margin = '0';
  piece.style.border = 'none';
  piece.style.boxShadow = 'none';
  piece.style.cursor = 'default';
  piece.style.transform = 'scale(1.08)';
  slot.appendChild(piece);
  slot.classList.add('filled');
  const ghost = slot.querySelector('.ghost');
  if(ghost) ghost.style.display = 'none';

  requestAnimationFrame(()=>{
    piece.style.transition = 'transform .18s ease';
    piece.style.transform = 'scale(1)';
  });

  sndPlace();
  puzzleCtx.filled++;
  if(puzzleCtx.filled >= puzzleCtx.total){
    setTimeout(onPuzzleComplete, 260);
  }
}

function onPuzzleComplete(){
  setDone(puzzleCtx.themeId, puzzleCtx.diffId, puzzleCtx.itemId);
  sndWin();
  spawnConfetti();
  const theme = getTheme(state.themeId);
  const item = theme.items[state.levelIndex];
  document.getElementById('win-sub').textContent = '你拼好了「'+item.name+'」，真厉害！';
  document.getElementById('win-modal').classList.add('show');
}

function spawnConfetti(){
  const emojis = ['⭐','🎉','✨','🌟','🎊'];
  for(let i=0;i<18;i++){
    const span = document.createElement('div');
    span.className = 'confetti';
    span.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    span.style.left = (Math.random()*100)+'vw';
    span.style.fontSize = (18+Math.random()*16)+'px';
    const dur = 1.2 + Math.random()*0.8;
    span.style.animationDuration = dur+'s';
    document.body.appendChild(span);
    setTimeout(()=>span.remove(), dur*1000+100);
  }
}
